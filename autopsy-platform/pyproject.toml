[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
# Named "autopsy", not "platform": "platform" clashes with Python's stdlib.
name = "autopsy"
version = "0.1.0"
description = "Pipeline Autopsy: a project-independent platform for investigating wrong pipeline output with read-only access"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6",
    "mcp>=1.2",
    "duckdb>=1.0",
    "starlette>=0.37",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
postgres = ["psycopg[binary]>=3.1"]

[project.scripts]
autopsy = "autopsy.cli:main"

[tool.setuptools.packages.find]
include = ["autopsy*"]

[tool.setuptools.package-data]
"autopsy.service" = ["static/*", "static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
