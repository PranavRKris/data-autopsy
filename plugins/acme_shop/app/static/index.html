<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Acme Shop</title>
  <meta name="description" content="Acme Shop: a small online shop with its own back office.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23c4472f'/%3E%3Cpath d='M9 13h14l-1.2 10H10.2z' fill='%23fff'/%3E%3Cpath d='M12.5 13v-1.5a3.5 3.5 0 017 0V13' fill='none' stroke='%23fff' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="app.css">
  <link rel="stylesheet" href="shop.css">
  <link rel="stylesheet" href="office.css">
</head>
<body data-area="shop">
  <!-- Shared pattern definitions for the revenue chart and its legend (referenced by id from other SVGs). -->
  <svg class="defs" width="0" height="0" aria-hidden="true" focusable="false">
    <defs>
      <pattern id="pat-stripes" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
        <rect width="3" height="6" fill="rgba(255,255,255,.5)"/>
      </pattern>
      <pattern id="pat-dots" width="6" height="6" patternUnits="userSpaceOnUse">
        <circle cx="3" cy="3" r="1.3" fill="rgba(255,255,255,.7)"/>
      </pattern>
      <pattern id="pat-cross" width="6" height="6" patternUnits="userSpaceOnUse">
        <path d="M0 0L6 6M6 0L0 6" stroke="#b3261e" stroke-width="1" fill="none"/>
      </pattern>
    </defs>
  </svg>

  <a class="skip" href="#main">Skip to content</a>
  <header class="topbar" id="topbar">
    <a class="brand" href="#/shop" aria-label="Acme Shop home">
      <svg class="brand-mark" viewBox="0 0 32 32" width="34" height="34" aria-hidden="true">
        <rect width="32" height="32" rx="9" class="brand-bg"/>
        <path d="M9 13h14l-1.2 10H10.2z" fill="#fff"/>
        <path d="M12.5 13v-1.6a3.5 3.5 0 017 0V13" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
        <path d="M13.5 17.5q2.5 2.2 5 0" fill="none" class="brand-smile" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
      <span class="brand-name">Acme Shop<span class="brand-sub">Back office</span></span>
    </a>
    <nav class="tabs" aria-label="Sections">
      <a href="#/shop" data-tab="shop">Shop</a>
      <a href="#/finance" data-tab="finance">Finance</a>
      <a href="#/operations" data-tab="operations">Operations</a>
    </nav>
    <div class="topbar-end">
      <span class="chip" id="chip-pipeline" data-kind="idle"><span class="chip-icon"></span><span class="chip-text">Pipeline</span></span>
      <span class="chip" id="chip-incidents" data-kind="idle"><span class="chip-icon"></span><span class="chip-text">Incidents</span></span>
      <a class="autopsy-link" id="autopsy-link" href="#" target="_blank" rel="noopener" hidden>
        <span>Open Autopsy</span>
      </a>
    </div>
  </header>
  <div id="banner" role="status" aria-live="polite"></div>
  <main id="main" tabindex="-1"></main>
  <div id="toasts" aria-live="polite" aria-atomic="false"></div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
